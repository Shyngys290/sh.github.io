<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ВТ 24А Істер тізімі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: glass control rail on the left (connection + animated progress ring), board on the right (Орындалмады | Орындалды) over a slowly drifting aurora. */
@property --p { syntax: "<number>"; inherits: false; initial-value: 0; }

:root {
  --bg: #eaeefb;
  --rail: #ffffff;
  --card: #ffffff;
  --field: #f2f5fc;
  --line: #d9e0f1;
  --text: #121a2f;
  --muted: #5b6785;
  --accent: #2446d6;
  --accent2: #7a3ff2;
  --accent-ink: #ffffff;
  --ok: #0f9a63;
  --ok-soft: #dcf5e9;
  --warn-soft: #e6ebfd;
  --err: #c63a2b;
  --track: #d9e0f1;
  --blob1: #6f8cff;
  --blob2: #55d6e6;
  --blob3: #b794ff;
  --blob-o: .5;
  --font-display: "Montserrat", "Segoe UI", Arial, sans-serif;
  --font-body: "Roboto", "Segoe UI", Arial, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f1f; --rail: #121a2f; --card: #172139; --field: #0c1325; --line: #26324f;
    --text: #e8edf9; --muted: #98a4c2; --accent: #7b96ff; --accent2: #b79bff; --accent-ink: #0b1230;
    --ok: #4fd69c; --ok-soft: #12382c; --warn-soft: #1d2a52; --err: #ff8a7a; --track: #26324f;
    --blob1: #2a46c9; --blob2: #0f8f9a; --blob3: #6a3fc8; --blob-o: .38; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0f1f; --rail: #121a2f; --card: #172139; --field: #0c1325; --line: #26324f;
  --text: #e8edf9; --muted: #98a4c2; --accent: #7b96ff; --accent2: #b79bff; --accent-ink: #0b1230;
  --ok: #4fd69c; --ok-soft: #12382c; --warn-soft: #1d2a52; --err: #ff8a7a; --track: #26324f;
  --blob1: #2a46c9; --blob2: #0f8f9a; --blob3: #6a3fc8; --blob-o: .38; color-scheme: dark;
}

* { box-sizing: border-box; }
html.theming *, html.theming *::before, html.theming *::after {
  transition: background-color .4s ease, color .4s ease, border-color .4s ease, box-shadow .4s ease !important;
}
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font-body); overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* aurora background */
.aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: var(--blob-o); will-change: transform; }
.aurora i:nth-child(1) { width: 52vmax; height: 52vmax; left: -12vmax; top: -16vmax; background: var(--blob1); animation: drift1 22s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { width: 44vmax; height: 44vmax; right: -12vmax; top: 18vh; background: var(--blob2); animation: drift2 26s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { width: 40vmax; height: 40vmax; left: 30vw; bottom: -22vmax; background: var(--blob3); animation: drift3 30s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(14vw, 12vh) scale(1.18); } }
@keyframes drift2 { to { transform: translate(-16vw, -10vh) scale(1.1); } }
@keyframes drift3 { to { transform: translate(-12vw, -14vh) scale(1.22); } }

@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .8s var(--ease) both; animation-delay: calc(var(--i, 0) * 90ms); }

.app { position: relative; z-index: 1; display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 100vh; }

/* rail */
.rail {
  background: color-mix(in srgb, var(--rail) 72%, transparent);
  -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
  border-right: 1px solid var(--line);
  padding: 24px 22px; display: flex; flex-direction: column; gap: 24px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.logo { font: 800 27px/1 var(--font-display); letter-spacing: -.01em; }
.logo span { background: linear-gradient(120deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tag { color: var(--muted); font-size: 14px; margin-top: 6px; }

.rail h2 { font: 700 12px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.f { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.f label { font-size: 14px; font-weight: 500; }
.in {
  width: 100%; background: var(--field); border: 1.5px solid var(--line); border-radius: 11px;
  padding: 11px 12px; font-size: 15px; min-width: 0;
  transition: border-color .25s, box-shadow .25s, background-color .25s;
}
.in:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.keywrap { position: relative; }
.keywrap .in { padding-right: 84px; }
.eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: transparent; border: 0; color: var(--accent); font-weight: 700; font-size: 13px; padding: 6px 8px; border-radius: 8px; transition: background-color .2s; }
.eye:hover { background: var(--warn-soft); }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.preset {
  background: var(--warn-soft); color: var(--accent); border: 0; border-radius: 99px;
  padding: 7px 13px; font-size: 13px; font-weight: 700;
  transition: transform .25s var(--ease), background-color .25s, color .25s, box-shadow .25s;
}
.preset:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -8px color-mix(in srgb, var(--accent) 60%, transparent); }
.preset:active { transform: scale(.95); }
.preset.on { background: var(--accent); color: var(--accent-ink); }

.go {
  position: relative; overflow: hidden; width: 100%; border: 0; border-radius: 13px; padding: 14px;
  background: linear-gradient(120deg, var(--accent), var(--accent2)); color: var(--accent-ink);
  font: 700 16px var(--font-display); display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 12px 24px -12px color-mix(in srgb, var(--accent) 80%, transparent);
  transition: transform .25s var(--ease), box-shadow .25s, opacity .25s;
}
.go::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%); transform: translateX(-120%); }
.go:hover { transform: translateY(-2px); box-shadow: 0 18px 30px -12px color-mix(in srgb, var(--accent) 85%, transparent); }
.go:hover::after { transform: translateX(120%); transition: transform .9s var(--ease); }
.go:active { transform: scale(.97); }
.go:disabled { opacity: .75; cursor: progress; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid color-mix(in srgb, var(--accent-ink) 35%, transparent); border-top-color: var(--accent-ink); animation: spin .7s linear infinite; display: none; }
.go.loading .spin { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

.msg { font-size: 13px; margin: 10px 0 0; min-height: 1.4em; transition: opacity .3s; }
.msg.err { color: var(--err); }
.msg.ok { color: var(--ok); }
.msg:not(:empty) { animation: rise .4s var(--ease) both; }
.note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }

.sum { display: flex; align-items: center; gap: 18px; }
.ring {
  --p: 0; flex: none; width: 118px; aspect-ratio: 1; border-radius: 50%;
  background: conic-gradient(var(--accent) 0, var(--ok) calc(var(--p) * 1%), var(--track) 0);
  display: grid; place-items: center; position: relative;
  transition: --p 1s var(--ease), transform .4s var(--ease);
  box-shadow: 0 0 34px -6px color-mix(in srgb, var(--ok) calc(var(--p) * .45%), transparent);
}
.ring:hover { transform: scale(1.05) rotate(-3deg); }
.ring::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--rail); }
.ring b { position: relative; font: 800 23px var(--font-display); font-variant-numeric: tabular-nums; }
.legend { display: grid; gap: 9px; font-size: 14px; min-width: 0; flex: 1; }
.legend div { display: flex; justify-content: space-between; gap: 14px; }
.legend strong { font: 700 15px var(--font-display); font-variant-numeric: tabular-nums; display: inline-block; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 8px; }

.theme {
  margin-top: auto; background: transparent; border: 1.5px solid var(--line); border-radius: 11px;
  padding: 10px; font-weight: 700; color: var(--text);
  transition: transform .25s var(--ease), border-color .25s, background-color .25s;
}
.theme:hover { border-color: var(--accent); transform: translateY(-2px); }
.theme:active { transform: scale(.97); }

/* board */
.main { padding: 28px 40px 56px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.bar h1 { font: 800 clamp(26px, 4vw, 36px)/1.15 var(--font-display); margin: 0; letter-spacing: -.015em; text-wrap: balance; }
.date { margin: 6px 0 0; color: var(--muted); font-size: 15px; text-transform: capitalize; }
.search { width: min(320px, 100%); }

.board { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; width: 100%; }
.col {
  background: color-mix(in srgb, var(--card) 62%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border: 1px solid var(--line); border-radius: 20px; padding: 16px;
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
  box-shadow: 0 20px 40px -28px rgba(18, 26, 47, .45);
}
.col-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.col-title { display: flex; align-items: center; gap: 10px; font: 700 17px var(--font-display); }
.count { min-width: 30px; text-align: center; padding: 2px 10px; border-radius: 99px; font: 700 13px var(--font-display); font-variant-numeric: tabular-nums; display: inline-block; }
.count { background: var(--warn-soft); color: var(--accent); }
.acts-head { display: flex; align-items: center; gap: 8px; }
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--field); border: 1px solid var(--line); border-radius: 13px; flex-wrap: wrap; }
.tab { border: 0; background: transparent; color: var(--muted); border-radius: 10px; padding: 8px 14px; font: 700 14px var(--font-display); display: inline-flex; align-items: center; gap: 8px; transition: background-color .25s, color .25s, transform .25s var(--ease); }
.tab:hover { color: var(--text); }
.tab:active { transform: scale(.96); }
.tab b { font: 700 12px var(--font-display); font-variant-numeric: tabular-nums; padding: 1px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--accent); display: inline-block; }
.tab.on { background: var(--card); color: var(--text); box-shadow: 0 2px 8px -2px rgba(18, 26, 47, .25); }
.tab.on[data-f="done"] b { background: var(--ok-soft); color: var(--ok); }
.bd { font: 700 12px var(--font-display); padding: 4px 11px; border-radius: 99px; white-space: nowrap; background: var(--warn-soft); color: var(--accent); }
.item.read .bd { background: var(--ok-soft); color: var(--ok); }
@media (min-width: 701px) {
  .item { grid-template-columns: auto minmax(0, 1fr) auto auto auto; align-items: center; gap: 14px; padding: 12px 18px; }
  .item .st { grid-row: auto; margin-top: 0; }
  .item .meta { display: contents; }
  .item .n { min-width: 56px; text-align: right; }
}
/* icon-only buttons */
.ib {
  width: 36px; height: 36px; padding: 0; display: grid; place-items: center; flex: none;
  border-radius: 11px; border: 1.5px solid var(--line); background: transparent; color: var(--muted);
  transition: transform .25s var(--ease), color .25s, border-color .25s, background-color .25s, filter .25s, box-shadow .25s;
}
.ib svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; display: block; }
.ib:hover:not(:disabled) { transform: translateY(-2px); color: var(--accent); border-color: var(--accent); box-shadow: 0 8px 16px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
.ib:active:not(:disabled) { transform: scale(.9); }
.ib:disabled { opacity: .4; cursor: default; }
.ib.del:hover:not(:disabled) { color: var(--err); border-color: var(--err); box-shadow: 0 8px 16px -10px color-mix(in srgb, var(--err) 70%, transparent); }
.ib.del.arm { background: var(--err); border-color: var(--err); color: #fff; animation: wiggle .45s var(--ease); }
@keyframes wiggle { 20% { transform: rotate(-12deg); } 50% { transform: rotate(10deg); } 80% { transform: rotate(-5deg); } }

ul.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item {
  position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 15px;
  padding: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px;
  box-shadow: 0 1px 2px rgba(18, 26, 47, .05);
  transition: transform .3s var(--ease), box-shadow .3s, border-color .3s;
}
.item::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(200px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
}
.item:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 16px 28px -16px color-mix(in srgb, var(--accent) 55%, transparent); }
.item:hover::before { opacity: 1; }
.item > * { position: relative; }
.st { grid-row: 1 / span 2; width: 24px; height: 24px; margin-top: 1px; }
.st svg { width: 100%; height: 100%; display: block; overflow: visible; }
.st .c { fill: none; stroke: var(--muted); stroke-width: 2; transition: fill .3s, stroke .3s; }
.st .k { fill: none; stroke: var(--accent-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; opacity: 0; }
.item.read .st .c { fill: var(--ok); stroke: var(--ok); }
.item.read .st .k { opacity: 1; stroke-dashoffset: 0; }
.item.read.just .st .k { stroke-dashoffset: 20; animation: draw .55s .1s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.item .t { font-weight: 500; overflow-wrap: anywhere; }
.item.read .t { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 55%, transparent); }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.n { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.acts { display: flex; align-items: center; gap: 8px; }
.item:not(.read) .ib.ok { background: linear-gradient(120deg, var(--accent), var(--accent2)); border-color: transparent; color: var(--accent-ink); }
.item:not(.read) .ib.ok:hover:not(:disabled) { color: var(--accent-ink); border-color: transparent; filter: brightness(1.1); }
.edit {
  width: 100%; font: inherit; font-weight: 500; color: var(--text); background: var(--field);
  border: 1.5px solid var(--accent); border-radius: 10px; padding: 7px 10px; outline: none;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); min-width: 0;
}
.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 22px 10px; border: 1.5px dashed var(--line); border-radius: 13px; animation: rise .5s var(--ease) both; }

.hero-empty { text-align: center; color: var(--muted); padding: 40px 16px; background: color-mix(in srgb, var(--card) 62%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 20px; }
.hero-empty b { display: block; color: var(--text); font: 700 19px var(--font-display); margin-bottom: 6px; }
.hero-empty svg { width: 96px; height: 96px; margin: 0 auto 10px; display: block; animation: float 4s ease-in-out infinite; }
.hero-empty .l1 { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 1.2s .3s var(--ease) forwards; }
.hero-empty .l2 { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 1.2s .6s var(--ease) forwards; }
@keyframes float { 50% { transform: translateY(-8px); } }

.toast {
  position: fixed; left: 50%; bottom: 26px; z-index: 60; transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 99px; font-weight: 700; font-size: 14px;
  box-shadow: 0 18px 36px -12px rgba(0, 0, 0, .45); transition: transform .5s var(--ease), opacity .4s; max-width: calc(100vw - 32px);
}
.toast.on { transform: translate(-50%, 0); opacity: 1; }
.confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .theme { margin-top: 0; }
  .main { padding: 20px 16px 40px; }
}
@media (max-width: 640px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .rail { padding: 20px 16px; }
}

/* ===== v2: flat paper style, checkbox on the left, bulk actions in a bottom dock ===== */
:root {
  --bg: #f4f1ea; --rail: #fffdf8; --card: #ffffff; --field: #fffdf8; --line: #1b1b1f;
  --text: #1b1b1f; --muted: #6a675f; --accent: #e8590c; --accent2: #e8590c; --accent-ink: #ffffff;
  --ok: #2b8a3e; --ok-soft: #d3f0da; --warn-soft: #ffe8d6; --err: #c92a2a; --track: #e3ded2;
  --font-display: "Montserrat", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16161a; --rail: #1d1d23; --card: #23232b; --field: #1d1d23; --line: #efece4;
    --text: #f1efe8; --muted: #a09c92; --accent: #ff8a4c; --accent2: #ff8a4c; --accent-ink: #16161a;
    --ok: #69db7c; --ok-soft: #1d3a25; --warn-soft: #3d2a1d; --err: #ff8787; --track: #3a3a44;
  }
}
:root[data-theme="dark"] {
  --bg: #16161a; --rail: #1d1d23; --card: #23232b; --field: #1d1d23; --line: #efece4;
  --text: #f1efe8; --muted: #a09c92; --accent: #ff8a4c; --accent2: #ff8a4c; --accent-ink: #16161a;
  --ok: #69db7c; --ok-soft: #1d3a25; --warn-soft: #3d2a1d; --err: #ff8787; --track: #3a3a44;
}
.aurora { display: none; }
.rail { background: var(--rail); -webkit-backdrop-filter: none; backdrop-filter: none; border-right: 2px solid var(--line); }
.logo span { background: none; color: var(--accent); -webkit-text-fill-color: currentColor; }
.in { border: 2px solid var(--line); border-radius: 8px; }
.in:focus { box-shadow: 4px 4px 0 var(--accent); }
.preset { border: 2px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); }
.preset.on { background: var(--accent); border-color: var(--line); }
.go { background: var(--accent); color: var(--accent-ink); border: 2px solid var(--line); border-radius: 10px; box-shadow: 4px 4px 0 var(--line); }
.go:hover { box-shadow: 6px 6px 0 var(--line); transform: translate(-2px, -2px); }
.go:active { box-shadow: 0 0 0 var(--line); transform: translate(4px, 4px); }
.go::after { display: none; }
.ring { background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--track) 0); box-shadow: none; }
.theme { border: 2px solid var(--line); border-radius: 10px; margin: 0; padding: 9px 16px; background: var(--card); box-shadow: 3px 3px 0 var(--line); white-space: nowrap; }
.theme:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--line); }

.main { padding-bottom: 120px; }
.bar { align-items: center; }
.bar h1 { letter-spacing: -.02em; }
.col { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; border: 0; box-shadow: none; padding: 0; gap: 16px; }
.col-head { justify-content: space-between; gap: 12px; }
.col-head .search { margin-left: auto; width: min(320px, 100%); }
.tabs { background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; box-shadow: 3px 3px 0 var(--line); }
.tab { border-radius: 7px; color: var(--text); }
.tab.on { background: var(--text); color: var(--bg); box-shadow: none; }
.tab b { background: var(--warn-soft); color: var(--accent); border-radius: 6px; }
.tab.on b { background: var(--accent); color: var(--accent-ink); }
.tab.on[data-f="done"] b { background: var(--ok); color: var(--accent-ink); }

ul.cards { gap: 12px; }
.item { border: 2px solid var(--line); border-radius: 12px; box-shadow: 4px 4px 0 var(--line); background: var(--card); }
.item::before { display: none; }
.item:hover { transform: translate(-2px, -2px); border-color: var(--line); box-shadow: 6px 6px 0 var(--line); }
.item.read { box-shadow: 2px 2px 0 var(--line); }
.bd { border-radius: 6px; border: 2px solid var(--line); background: var(--warn-soft); color: var(--text); }
.item.read .bd { background: var(--ok-soft); color: var(--text); }

/* buttons */
.ib { border: 2px solid var(--line); border-radius: 9px; color: var(--text); background: var(--card); }
.ib:hover:not(:disabled) { color: var(--accent); border-color: var(--line); box-shadow: 2px 2px 0 var(--line); transform: translate(-1px, -1px); }
.ib.del:hover:not(:disabled) { color: var(--err); border-color: var(--line); box-shadow: 2px 2px 0 var(--line); }
.ib.del.arm { background: var(--err); border-color: var(--line); }

/* the tick button now sits at the far LEFT of each row and works as a big checkbox */
.item .ib.ok { order: 0; width: 40px; height: 40px; border-radius: 10px; background: var(--card); color: transparent; box-shadow: none; }
.item .ib.ok svg { stroke-width: 3; }
.item:not(.read) .ib.ok { background: var(--card); border-color: var(--line); color: transparent; }
.item:not(.read) .ib.ok:hover:not(:disabled) { color: var(--ok); background: var(--ok-soft); filter: none; }
.item.read .ib.ok { background: var(--ok); border-color: var(--line); color: var(--accent-ink); }
.item.read .ib.ok:hover:not(:disabled) { filter: brightness(1.08); color: var(--accent-ink); }
.item.read.just .ib.ok svg path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .5s .1s var(--ease) forwards; }
.item { grid-template-columns: auto minmax(0, 1fr); }
@media (min-width: 701px) {
  .item { grid-template-columns: auto minmax(0, 1fr) auto auto auto; gap: 16px; padding: 12px 18px 12px 12px; }
}

/* bulk actions: moved from the header into a bottom dock */
.dock { position: sticky; bottom: 18px; z-index: 5; align-self: center; display: flex; gap: 8px; padding: 8px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; box-shadow: 5px 5px 0 var(--line); }
.dock .dk { border: 2px solid var(--line); border-radius: 9px; padding: 9px 16px; background: var(--card); font: 700 14px var(--font-display); display: inline-flex; align-items: center; gap: 8px; transition: transform .2s var(--ease), box-shadow .2s, background-color .2s; }
.dock .dk svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.dock .dk:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--line); }
.dock .dk:active:not(:disabled) { transform: scale(.96); }
.dock .dk:disabled { opacity: .4; cursor: default; }
.dock #allRead { background: var(--ok); color: var(--accent-ink); }
@media (max-width: 640px) {
  .dock { left: 0; right: 0; width: 100%; } .dock .dk { flex: 1; justify-content: center; padding: 10px 6px; font-size: 13px; }
  .col-head .search { width: 100%; margin-left: 0; }
}
.toast { border-radius: 10px; border: 2px solid var(--line); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  .aurora i { animation: none; }
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app">

  <aside class="rail">
    <div class="rise" style="--i:0">
      <div class="logo">ВТ <span>24А</span></div>
      <div class="tag">Істер тізімі</div>
    </div>

    <section class="rise" style="--i:1" aria-labelledby="hConn">
      <h2 id="hConn">Қосылу</h2>
      <div class="f">
        <label for="url">API сілтемесі</label>
        <input class="in" id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" value="https://dummyjson.com/todos">
      </div>
      <div class="presets">
        <button class="preset" type="button" data-url="https://dummyjson.com/todos">DummyJSON</button>
        <button class="preset" type="button" data-url="https://jsonplaceholder.typicode.com/todos">JSONPlaceholder</button>
        <button class="preset" type="button" data-url="https://dummyjson.com/todos/random">Кездейсоқ тапсырма</button>
      </div>
      <div class="f">
        <label for="key">API кілті</label>
        <div class="keywrap">
          <input class="in" id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Кілтті енгізіңіз">
          <button class="eye" id="showKey" type="button" aria-pressed="false">Көрсету</button>
        </div>
      </div>
      <div class="f">
        <label for="mode">Кілтті жіберу тәсілі</label>
        <select class="in" id="mode">
          <option value="bearer">Authorization: Bearer</option>
          <option value="xapi">X-API-Key тақырыбы</option>
          <option value="query">?api_key= параметрі</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="remember"> Кілтті осы браузерде сақтау</label>
      <div style="height:14px"></div>
      <button class="go" id="loadBtn" type="button"><i class="spin"></i><span id="goText">Тапсырмаларды жүктеу</span></button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <p class="note">Тапсырмалар тек API кілті бойынша көрсетіледі. Әр кілттің өз тізімі мен белгілері бөлек сақталады.</p>
    </section>

    <section class="rise" style="--i:2" aria-labelledby="hProg">
      <h2 id="hProg">Прогресс</h2>
      <div class="sum">
        <div class="ring" id="ring"><b id="pct">0%</b></div>
        <div class="legend">
          <div><span><i class="dot" style="background:var(--muted)"></i>Барлығы</span><strong id="sAll">0</strong></div>
          <div><span><i class="dot" style="background:var(--ok)"></i>Орындалды</span><strong id="sRead">0</strong></div>
          <div><span><i class="dot" style="background:var(--accent)"></i>Орындалмады</span><strong id="sUnread">0</strong></div>
        </div>
      </div>
    </section>

  </aside>

  <main class="main">
    <div class="bar rise" style="--i:1">
      <div>
        <h1>Тапсырмалар трекері</h1>
        <p class="date" id="date"></p>
      </div>
      <button class="theme" id="themeBtn" type="button">Қараңғы тақырып</button>
    </div>

    <div class="hero-empty rise" style="--i:2" id="none" hidden></div>

    <div class="board rise" style="--i:2" id="board">
      <section class="col" aria-labelledby="hAll">
        <div class="col-head">
          <div class="tabs" role="group" aria-label="Сүзгі">
            <button class="tab on" type="button" data-f="all" aria-pressed="true">Барлығы <b id="tAll">0</b></button>
            <button class="tab" type="button" data-f="open" aria-pressed="false">Орындалмады <b id="tOpen">0</b></button>
            <button class="tab" type="button" data-f="done" aria-pressed="false">Орындалды <b id="tDone">0</b></button>
          </div>
          <span id="cAll" hidden>0</span>
          <input class="in search" id="q" type="search" placeholder="Тапсырма іздеу" aria-label="Тапсырма іздеу" autocomplete="off">
        </div>
        <ul class="cards" id="listAll"></ul>
        <div class="empty" id="emAll" hidden>Тапсырма табылмады</div>
      </section>
    </div>

    <div class="dock rise" style="--i:3" role="group" aria-label="Жаппай әрекеттер">
      <button class="dk" id="allUnread" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Барлығын қайтару</button>
      <button class="dk" id="allRead" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12.5l4.5 4.5L15 8"/><path d="M11.5 15.5l1.5 1.5L22 8"/></svg>Барлығын орындалды деп белгілеу</button>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var urlEl = $('#url'), keyEl = $('#key'), modeEl = $('#mode'), rememberEl = $('#remember');
  var loadBtn = $('#loadBtn'), msgEl = $('#msg');
  var state = { tasks: [], q: '', f: 'all', sig: null, titles: {}, deleted: {} };

  function sget(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function sset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function sdel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(16); }
  function sigOf(url, key) { return key ? 'bt24a:' + hash(key) + ':' + hash(url) : null; }
  function say(t, kind) { msgEl.textContent = t || ''; msgEl.className = 'msg' + (kind ? ' ' + kind : ''); }

  /* today's date in Kazakh */
  try { $('#date').textContent = new Date().toLocaleDateString('kk-KZ', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) {}

  /* theme with smooth cross-fade */
  var themeBtn = $('#themeBtn');
  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function paintTheme() { themeBtn.textContent = isDark() ? 'Ашық тақырып' : 'Қараңғы тақырып'; }
  var st = sget('bt24a:theme2');
  if (st) document.documentElement.setAttribute('data-theme', st);
  paintTheme();
  themeBtn.addEventListener('click', function () {
    var root = document.documentElement;
    root.classList.add('theming');
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    sset('bt24a:theme2', next); paintTheme();
    setTimeout(function () { root.classList.remove('theming'); }, 500);
  });

  /* animated numbers */
  function tween(el, to, suffix) {
    suffix = suffix || '';
    var from = el._v == null ? 0 : el._v;
    el._v = to; el._tok = (el._tok || 0) + 1;
    var tok = el._tok;
    if (reduce || from === to) { el.textContent = to + suffix; return; }
    var t0 = performance.now(), d = 650;
    el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'ease-out' });
    (function step(t) {
      if (tok !== el._tok) return;
      var k = Math.min(1, (t - t0) / d); k = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * k) + suffix;
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  /* parsing */
  function extractList(d) {
    if (Array.isArray(d)) return d;
    if (d && typeof d === 'object') {
      var keys = ['todos', 'tasks', 'items', 'data', 'results'];
      for (var i = 0; i < keys.length; i++) if (Array.isArray(d[keys[i]])) return d[keys[i]];
      return [d];
    }
    return [];
  }
  function toTask(o, i) {
    if (!o || typeof o !== 'object') return null;
    var title = o.todo != null ? o.todo : o.title != null ? o.title : o.name != null ? o.name : o.text != null ? o.text : o.task != null ? o.task : o.description;
    if (title == null) return null;
    var done = o.completed != null ? o.completed : o.done != null ? o.done : o.read != null ? o.read : false;
    if (typeof o.status === 'string') done = ['done', 'completed', 'read', 'closed'].indexOf(o.status.toLowerCase()) > -1;
    /* API тапсырмалары ағылшынша келеді, сондықтан қазақша «Тест» және «ТБ» атауларымен ауыстырылады */
    var num = parseInt(o.id, 10); if (!(num > 0)) num = i + 1;
    var subj = ['Математика', 'Физика', 'Информатика', 'Қазақ тілі', 'Тарих', 'Ағылшын тілі'];
    var kk = subj[Math.ceil(num / 2) % subj.length] + ' \u2013 ' + (num % 2 ? 'Тест' : 'ТБ') + ' ' + Math.ceil(num / 12);
    return { id: String(o.id != null ? o.id : i + 1), title: kk, read: !!done };
  }
  function persist() { if (state.sig) sset(state.sig, { tasks: state.tasks, titles: state.titles, deleted: state.deleted, savedAt: Date.now() }); }

  /* load */
  async function load() {
    var url = urlEl.value.trim(), key = keyEl.value.trim();
    if (!key) { say('Алдымен API кілтін енгізіңіз. Кілтсіз тапсырмалар көрсетілмейді.', 'err'); keyEl.focus(); return; }
    var u;
    try { u = new URL(url); } catch (e) { say('API сілтемесі дұрыс емес. https://… түрінде енгізіңіз.', 'err'); urlEl.focus(); return; }
    if (u.protocol !== 'https:') { say('Тек HTTPS сілтемесі қабылданады.', 'err'); return; }

    var headers = { 'Accept': 'application/json' };
    var mode = modeEl.value;
    if (mode === 'bearer') headers['Authorization'] = 'Bearer ' + key;
    else if (mode === 'xapi') headers['X-API-Key'] = key;
    else u.searchParams.set('api_key', key);

    loadBtn.disabled = true; loadBtn.classList.add('loading'); $('#goText').textContent = 'Жүктелуде…'; say('');
    try {
      var res = await fetch(u.toString(), { headers: headers });
      if (res.status === 401 || res.status === 403) throw new Error('auth');
      if (!res.ok) throw new Error('http ' + res.status);
      var data = await res.json();
      var tasks = extractList(data).map(toTask).filter(Boolean);
      if (!tasks.length) { say('API жауап берді, бірақ тапсырмалар табылмады.', 'err'); return; }

      var sig = sigOf(url, key), old = sget(sig), seen = {};
      var titles = (old && old.titles) || {}, deleted = (old && old.deleted) || {};
      if (old && old.tasks) old.tasks.forEach(function (t) { seen[t.id] = t.read; });
      tasks = tasks.filter(function (t) { return !deleted[t.id]; });
      tasks.forEach(function (t) {
        if (t.id in seen) t.read = seen[t.id];
        if (titles[t.id]) t.title = titles[t.id];
      });

      state.sig = sig; state.tasks = tasks; state.titles = titles; state.deleted = deleted; persist();
      if (rememberEl.checked) { sset('bt24a:key', key); sset('bt24a:url', url); sset('bt24a:mode', mode); }
      say(tasks.length + ' тапсырма жүктелді.', 'ok');
      render({ mode: 'load' });
    } catch (e) {
      if (e.message === 'auth') say('API кілті қабылданбады (401/403). Кілтті тексеріңіз.', 'err');
      else if (e instanceof TypeError) say('Сұраныс орындалмады. Интернетті, сілтемені тексеріңіз немесе кілтті жіберу тәсілін өзгертіңіз: API браузерден жүктеуге рұқсат бермеуі мүмкін.', 'err');
      else say('API қате қайтарды: ' + e.message + '.', 'err');
    } finally {
      loadBtn.disabled = false; loadBtn.classList.remove('loading'); $('#goText').textContent = 'Тапсырмаларды жүктеу';
    }
  }

  function syncToKey() {
    var key = keyEl.value.trim(), url = urlEl.value.trim();
    var sig = sigOf(url, key), saved = sig ? sget(sig) : null;
    state.sig = sig;
    state.tasks = saved && saved.tasks ? saved.tasks : [];
    state.titles = (saved && saved.titles) || {};
    state.deleted = (saved && saved.deleted) || {};
    markPreset();
    render({ mode: 'load' });
  }
  function markPreset() {
    var cur = urlEl.value.trim();
    document.querySelectorAll('.preset').forEach(function (p) { p.classList.toggle('on', p.getAttribute('data-url') === cur); });
  }

  /* card DOM */
  var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="c" cx="12" cy="12" r="10"/><path class="k" d="M7.2 12.6l3.2 3.2 6.4-6.9"/></svg>';
  function card(t) {
    var li = document.createElement('li'); li.className = 'item' + (t.read ? ' read' : ''); li.dataset.id = t.id;
    var title = document.createElement('div'); title.className = 't'; title.textContent = t.title;
    var meta = document.createElement('div'); meta.className = 'meta';
    var bd = document.createElement('span'); bd.className = 'bd'; bd.textContent = t.read ? 'Орындалды' : 'Орындалмады';
    var n = document.createElement('span'); n.className = 'n'; n.textContent = '№ ' + t.id;

    var acts = document.createElement('div'); acts.className = 'acts';
    var ed = iconBtn('', I.edit, 'Атауын өзгерту');
    var del = iconBtn('del', I.del, 'Жою');
    var tg = iconBtn('ok', I.ok, t.read ? 'Орындалмады деп белгілеу' : 'Орындалды деп белгілеу');

    ed.addEventListener('click', function () { startEdit(li, t); });
    tg.addEventListener('click', function () { commit(function () { t.read = !t.read; }, t.id); });

    /* delete needs a second click, so a stray tap does not remove a task */
    var armT;
    function disarm() { clearTimeout(armT); del.classList.remove('arm'); del.title = 'Жою'; del.setAttribute('aria-label', 'Жою'); }
    del.addEventListener('click', function () {
      if (!del.classList.contains('arm')) {
        del.classList.add('arm'); del.title = 'Жоюды растау'; del.setAttribute('aria-label', 'Жоюды растау');
        clearTimeout(armT); armT = setTimeout(disarm, 2600);
        return;
      }
      disarm(); removeTask(li, t);
    });
    del.addEventListener('blur', disarm);

    acts.appendChild(ed); acts.appendChild(del);
    meta.appendChild(bd); meta.appendChild(n); meta.appendChild(acts);
    li.appendChild(tg); li.appendChild(title); li.appendChild(meta);
    return li;
  }

  var I = {
    ok: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    undo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>',
    edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
    del: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></svg>'
  };
  function iconBtn(cls, svg, label) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'ib ' + cls; b.innerHTML = svg;
    b.setAttribute('aria-label', label); b.title = label;
    return b;
  }

  /* rename in place: Enter or click away saves, Esc cancels */
  function startEdit(li, t) {
    if (li.classList.contains('editing')) return;
    var tEl = li.querySelector('.t'); if (!tEl) return;
    li.classList.add('editing');
    var inp = document.createElement('input');
    inp.className = 'edit'; inp.type = 'text'; inp.value = t.title; inp.maxLength = 200;
    inp.setAttribute('aria-label', 'Тапсырма атауы');
    tEl.replaceWith(inp); inp.focus(); inp.select();
    var done = false;
    function finish(save) {
      if (done) return; done = true;
      var v = inp.value.trim();
      if (save && v && v !== t.title) { t.title = v; state.titles[t.id] = v; persist(); }
      var nt = document.createElement('div'); nt.className = 't'; nt.textContent = t.title;
      inp.replaceWith(nt); li.classList.remove('editing');
      if (!reduce) nt.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
      var eb = li.querySelector('.acts .ib'); if (eb) try { eb.focus({ preventScroll: true }); } catch (e) {}
    }
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
    inp.addEventListener('blur', function () { finish(true); });
  }

  /* delete: card fades out, the rest glide up to fill the gap */
  function removeTask(li, t) {
    function go() { commit(function () { state.tasks = state.tasks.filter(function (x) { return x !== t; }); state.deleted[t.id] = 1; }, null); }
    if (reduce) { go(); return; }
    li.style.pointerEvents = 'none';
    var a = li.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(26px) scale(.94)' }], { duration: 260, easing: 'ease-in', fill: 'forwards' });
    a.onfinish = go;
  }
  function rects() {
    var m = {};
    document.querySelectorAll('.item').forEach(function (el) { m[el.dataset.id] = el.getBoundingClientRect(); });
    return m;
  }
  function isDone() { return state.tasks.length > 0 && state.tasks.every(function (t) { return t.read; }); }

  /* state change with smooth card flight (FLIP) */
  function commit(fn, id) {
    var before = rects(), was = isDone(), prev = {};
    state.tasks.forEach(function (t) { prev[t.id] = t.read; });
    fn(); persist();
    render({ mode: 'move', before: before, id: id, prev: prev });
    if (id) {
      var el = document.querySelector('.item[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"] .ib.ok');
      if (el) try { el.focus({ preventScroll: true }); } catch (e) {}
    }
    if (!was && isDone()) celebrate();
  }

  function render(opts) {
    opts = opts || { mode: 'quiet' };
    var all = state.tasks.length;
    var read = state.tasks.filter(function (t) { return t.read; }).length;
    var unread = all - read;
    var p = all ? Math.round(read / all * 100) : 0;
    tween($('#sAll'), all); tween($('#sRead'), read); tween($('#sUnread'), unread);
    tween($('#cAll'), all); tween($('#tAll'), all); tween($('#tOpen'), unread); tween($('#tDone'), read);
    document.querySelectorAll('.tab').forEach(function (b) { var on = b.getAttribute('data-f') === state.f; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    tween($('#pct'), p, '%');
    $('#ring').style.setProperty('--p', p);

    var q = state.q.toLowerCase();
    var L = $('#listAll');
    L.textContent = '';
    var shown = 0;
    state.tasks.forEach(function (t) {
      if (q && t.title.toLowerCase().indexOf(q) < 0) return;
      if (state.f === 'open' && t.read) return;
      if (state.f === 'done' && !t.read) return;
      var li = card(t);
      if (opts.prev && t.read && opts.prev[t.id] === false) li.classList.add('just');
      L.appendChild(li); shown++;
    });
    $('#emAll').textContent = state.f === 'open' ? 'Орындалмаған тапсырма жоқ' : state.f === 'done' ? 'Орындалған тапсырма жоқ' : 'Тапсырма табылмады';
    $('#emAll').hidden = shown > 0;
    $('#allRead').disabled = !unread; $('#allUnread').disabled = !read;

    var none = $('#none');
    if (!all) {
      none.hidden = false; $('#board').hidden = true;
      none.innerHTML = '<svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<rect x="22" y="16" width="52" height="68" rx="9" style="color:var(--accent)"/>' +
        '<rect x="36" y="9" width="24" height="14" rx="5" style="color:var(--accent2)"/>' +
        '<path class="l1" d="M34 42h28" style="color:var(--muted)"/><path class="l2" d="M34 56h18" style="color:var(--muted)"/>' +
        '<path d="M34 70h10" style="color:var(--ok)"/></svg>' +
        '<b>Тапсырмалар жоқ</b>Сол жақта API кілтін енгізіп, «Тапсырмаларды жүктеу» батырмасын басыңыз.';
    } else { none.hidden = true; $('#board').hidden = false; }

    if (reduce) return;
    var items = document.querySelectorAll('.item');
    if (opts.mode === 'load') {
      items.forEach(function (el, i) {
        el.animate([{ opacity: 0, transform: 'translateY(16px) scale(.97)' }, { opacity: 1, transform: 'none' }],
          { duration: 560, delay: Math.min(i, 16) * 45, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
      });
    } else if (opts.mode === 'move' && opts.before) {
      var k = 0;
      items.forEach(function (el) {
        var b = opts.before[el.dataset.id]; if (!b) return;
        var a = el.getBoundingClientRect();
        var dx = b.left - a.left, dy = b.top - a.top;
        var me = el.dataset.id === opts.id;
        if (!dx && !dy) {
          if (me) el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.03)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'ease-out' });
          return;
        }
        if (me) el.style.zIndex = 5;
        var anim = el.animate(
          me ? [{ transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1.05) rotate(-2deg)', boxShadow: '0 26px 40px -14px rgba(36,70,214,.55)' }, { transform: 'none', boxShadow: '0 1px 2px rgba(18,26,47,.05)' }]
             : [{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }],
          { duration: me ? 700 : 520, delay: opts.id ? 0 : Math.min(k++, 20) * 25, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
        if (me) anim.onfinish = function () { el.style.zIndex = ''; };
      });
    }
  }

  /* celebration */
  var toastT;
  function toast(text) {
    var t = $('#toast'); t.textContent = text; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 3400);
  }
  function celebrate() {
    toast('Барлық тапсырма орындалды. Керемет жұмыс!');
    if (reduce) return;
    var c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
    var dpr = window.devicePixelRatio || 1, W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
    var cs = getComputedStyle(document.documentElement);
    var cols = ['--accent', '--accent2', '--ok'].map(function (v) { return cs.getPropertyValue(v).trim(); }).concat(['#ffc857', '#ff7ab6']);
    var ps = [];
    for (var i = 0; i < 150; i++) {
      ps.push({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .4, vx: (Math.random() - .5) * 15 * dpr, vy: (-Math.random() * 15 - 4) * dpr,
        g: .4 * dpr, s: (5 + Math.random() * 6) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .4, col: cols[i % cols.length] });
    }
    var ctx = c.getContext('2d'), start = performance.now();
    (function frame(t) {
      var el = t - start;
      ctx.clearRect(0, 0, W, H);
      ps.forEach(function (p) {
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr;
        ctx.globalAlpha = Math.max(0, 1 - el / 2600);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col;
        ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore();
      });
      if (el < 2600) requestAnimationFrame(frame); else c.remove();
    })(start);
  }

  /* events */
  loadBtn.addEventListener('click', load);
  [urlEl, keyEl].forEach(function (el) { el.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); }); });
  var t0;
  [urlEl, keyEl].forEach(function (el) { el.addEventListener('input', function () { clearTimeout(t0); t0 = setTimeout(syncToKey, 300); }); });
  document.querySelectorAll('.preset').forEach(function (c) {
    c.addEventListener('click', function () { urlEl.value = c.getAttribute('data-url'); say(''); syncToKey(); });
  });
  $('#showKey').addEventListener('click', function (e) {
    var show = keyEl.type === 'password';
    keyEl.type = show ? 'text' : 'password';
    e.currentTarget.textContent = show ? 'Жасыру' : 'Көрсету';
    e.currentTarget.setAttribute('aria-pressed', String(show));
  });
  rememberEl.addEventListener('change', function () {
    if (!rememberEl.checked) { sdel('bt24a:key'); sdel('bt24a:url'); sdel('bt24a:mode'); }
  });
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { state.f = b.getAttribute('data-f'); render({ mode: 'load' }); });
  });
  $('#q').addEventListener('input', function (e) { state.q = e.target.value.trim(); render({ mode: 'quiet' }); });
  $('#allRead').addEventListener('click', function () { commit(function () { state.tasks.forEach(function (t) { t.read = true; }); }); });
  $('#allUnread').addEventListener('click', function () { commit(function () { state.tasks.forEach(function (t) { t.read = false; }); }); });

  /* soft light that follows the pointer over cards */
  $('#board').addEventListener('pointermove', function (e) {
    var it = e.target.closest ? e.target.closest('.item') : null; if (!it) return;
    var r = it.getBoundingClientRect();
    it.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    it.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });

  /* init */
  var sk = sget('bt24a:key');
  if (sk) {
    keyEl.value = sk; rememberEl.checked = true;
    var su = sget('bt24a:url'); if (su) urlEl.value = su;
    var sm = sget('bt24a:mode'); if (sm) modeEl.value = sm;
  }
  syncToKey();
})();
</script>
</body>
</html>
